<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>空天海多域网络可视化</title>

    <!-- CesiumJS 1.141 -->
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.141/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.141/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

    <style>
        :root {
            --bg-glass: rgba(13, 17, 28, 0.82);
            --bg-glass-hover: rgba(20, 26, 42, 0.9);
            --border: rgba(255, 255, 255, 0.08);
            --accent: #38bdf8;
            --text: #e6edf3;
            --text-dim: #8b98a9;
            --good: #34d399;
            --warn: #fbbf24;
            --bad: #f87171;
            --radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            background: #000;
            color: var(--text);
        }

        #cesiumContainer { width: 100%; height: 100%; position: relative; }

        /* Hide Cesium default credit container clutter */
        .cesium-viewer-bottom { display: none; }

        /* ---------- Glass panel base ---------- */
        .glass {
            position: absolute;
            background: var(--bg-glass);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
            z-index: 20;
            color: var(--text);
        }

        /* ---------- Top bar ---------- */
        #topBar {
            position: absolute;
            top: 14px; left: 14px; right: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
            pointer-events: none;
        }
        #brand {
            pointer-events: auto;
            background: var(--bg-glass);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            backdrop-filter: blur(14px);
            padding: 9px 16px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        #brand .sub {
            font-size: 11px;
            font-weight: 400;
            color: var(--text-dim);
            margin-left: 8px;
        }
        #connChip {
            pointer-events: auto;
            background: var(--bg-glass);
            border: 1px solid var(--border);
            border-radius: 999px;
            backdrop-filter: blur(14px);
            padding: 7px 14px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 7px;
        }
        .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--bad);
            box-shadow: 0 0 6px var(--bad);
        }
        .dot.on { background: var(--good); box-shadow: 0 0 6px var(--good); }

        /* ---------- Side panels (layers / stats / detail) ---------- */
        .side-panel {
            width: 230px;
            overflow: hidden;
            transition: transform 0.28s cubic-bezier(.4,0,.2,1), opacity 0.28s;
        }
        #layersPanel { left: 14px; top: 70px; }
        #statsPanel  { right: 14px; top: 70px; }
        #detailPanel { right: 14px; top: 70px; width: 280px; display: none; }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 11px 14px;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text);
            border-bottom: 1px solid var(--border);
            user-select: none;
        }
        .panel-header .collapse-btn {
            background: none; border: none; color: var(--text-dim);
            cursor: pointer; font-size: 15px; line-height: 1;
            padding: 2px 4px; border-radius: 4px;
        }
        .panel-header .collapse-btn:hover { color: var(--text); background: rgba(255,255,255,0.08); }
        .panel-body { padding: 12px 14px; }

        .side-panel.collapsed .panel-body { display: none; }
        .side-panel.collapsed { width: auto; }

        /* Re-open tab shown when collapsed */
        .reopen-tab {
            position: absolute;
            top: 70px;
            background: var(--bg-glass);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            backdrop-filter: blur(14px);
            padding: 8px 10px;
            cursor: pointer;
            z-index: 19;
            font-size: 13px;
            color: var(--text-dim);
            display: none;
        }
        .reopen-tab:hover { color: var(--text); }
        #layersReopen { left: 14px; }
        #statsReopen  { right: 14px; }

        /* ---------- Layer legend items ---------- */
        .layer-group-label {
            font-size: 10.5px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            margin: 10px 0 6px;
        }
        .layer-group-label:first-child { margin-top: 0; }
        .layer-item {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 5px 6px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 12.5px;
            transition: background 0.15s;
        }
        .layer-item:hover { background: rgba(255,255,255,0.06); }
        .layer-item input { display: none; }
        .layer-item .swatch {
            width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0;
            box-shadow: 0 0 5px rgba(0,0,0,0.4);
            position: relative;
        }
        .layer-item .swatch.line { height: 3px; border-radius: 2px; width: 16px; }
        .layer-item input:not(:checked) ~ .swatch { opacity: 0.25; }
        .layer-item input:not(:checked) ~ .lbl { color: var(--text-dim); text-decoration: line-through; }
        .layer-item .lbl { flex: 1; }

        /* ---------- Stats ---------- */
        .stat-row {
            display: flex;
            justify-content: space-between;
            font-size: 12.5px;
            padding: 3.5px 0;
        }
        .stat-row .k { color: var(--text-dim); }
        .stat-row .v { font-weight: 600; font-variant-numeric: tabular-nums; }
        #metricsSummary {
            margin-top: 9px;
            padding-top: 9px;
            border-top: 1px solid var(--border);
            font-size: 11px;
            line-height: 1.6;
            color: var(--text-dim);
        }

        /* ---------- Detail panel ---------- */
        .detail-type-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .detail-endpoints {
            font-size: 12.5px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 8px 10px;
            margin-bottom: 12px;
            line-height: 1.5;
            word-break: break-all;
        }
        .detail-endpoints .arrow { color: var(--accent); margin: 0 6px; }
        .metric-block { margin-bottom: 11px; }
        .metric-block .metric-label {
            display: flex; justify-content: space-between;
            font-size: 11.5px; color: var(--text-dim); margin-bottom: 5px;
        }
        .metric-block .metric-label .mv { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
        .progress-track {
            height: 6px; border-radius: 3px;
            background: rgba(255,255,255,0.1);
            overflow: hidden;
        }
        .progress-fill {
            height: 100%; border-radius: 3px;
            background: linear-gradient(90deg, var(--good), var(--warn), var(--bad));
            width: 0%;
            transition: width 0.3s ease;
        }
        .detail-status {
            display: flex; align-items: center; gap: 7px;
            font-size: 12px; margin-top: 4px;
        }

        /* ---------- Bottom playback bar ---------- */
        #playbackBar {
            left: 50%;
            transform: translateX(-50%);
            bottom: 22px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            width: min(680px, calc(100vw - 40px));
        }
        .pb-btn {
            width: 36px; height: 36px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.1);
            color: var(--text);
            cursor: pointer;
            font-size: 14px;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.15s, transform 0.1s;
            flex-shrink: 0;
        }
        .pb-btn:hover { background: rgba(255,255,255,0.2); }
        .pb-btn:active { transform: scale(0.94); }
        .pb-btn.primary { background: var(--accent); color: #04121f; }
        .pb-btn.primary:hover { background: #67d3fb; }

        #simTime {
            font-size: 13px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            min-width: 52px;
            text-align: center;
            color: var(--accent);
        }

        #timelineSlider { flex: 1; min-width: 80px; }

        input[type="range"] {
            -webkit-appearance: none;
            height: 5px;
            border-radius: 3px;
            background: rgba(255,255,255,0.15);
            outline: none;
            cursor: pointer;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px; height: 14px; border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 6px rgba(56,189,248,0.6);
            cursor: pointer;
        }
        input[type="range"]::-moz-range-thumb {
            width: 14px; height: 14px; border-radius: 50%;
            background: var(--accent); border: none; cursor: pointer;
        }

        #speedSelect {
            background: rgba(255,255,255,0.1);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 8px;
            font-size: 12px;
            cursor: pointer;
            flex-shrink: 0;
        }
        #speedSelect option { background: #161b27; }

        /* ---------- Hint toast ---------- */
        #hintToast {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 86px;
            background: var(--bg-glass);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 7px 16px;
            font-size: 12px;
            color: var(--text-dim);
            z-index: 18;
            backdrop-filter: blur(14px);
            pointer-events: none;
            opacity: 1;
            transition: opacity 0.6s;
        }
        #hintToast.hide { opacity: 0; }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>

    <!-- Top bar -->
    <div id="topBar">
        <div id="brand">空天海多域网络可视化<span class="sub">CesiumJS 1.141 · Protocol v2</span></div>
        <div id="connChip">
            <span class="dot" id="connectionIndicator"></span>
            <span id="connectionStatus">未连接</span>
        </div>
    </div>

    <!-- Layers panel (left) -->
    <div id="layersPanel" class="glass side-panel">
        <div class="panel-header">
            <span>图层</span>
            <button class="collapse-btn" id="layersCollapse" title="收起">‹</button>
        </div>
        <div class="panel-body">
            <div class="layer-group-label">节点</div>
            <label class="layer-item"><input type="checkbox" id="toggleSatellite" checked><span class="swatch" style="background:#1E90FF"></span><span class="lbl">卫星</span></label>
            <label class="layer-item"><input type="checkbox" id="toggleUav" checked><span class="swatch" style="background:#32CD32"></span><span class="lbl">无人机</span></label>
            <label class="layer-item"><input type="checkbox" id="toggleShip" checked><span class="swatch" style="background:#FFA500"></span><span class="lbl">船舶</span></label>
            <label class="layer-item"><input type="checkbox" id="toggleGroundStation" checked><span class="swatch" style="background:#FF4500"></span><span class="lbl">地面站</span></label>
            <div class="layer-group-label">链路</div>
            <label class="layer-item"><input type="checkbox" id="toggleISL" checked><span class="swatch line" style="background:#4FC3F7"></span><span class="lbl">ISL 星间</span></label>
            <label class="layer-item"><input type="checkbox" id="toggleGSL" checked><span class="swatch line" style="background:#FF8A65"></span><span class="lbl">GSL 地面</span></label>
            <label class="layer-item"><input type="checkbox" id="toggleSUL" checked><span class="swatch line" style="background:#81C784"></span><span class="lbl">SUL 无人机</span></label>
            <label class="layer-item"><input type="checkbox" id="toggleSSL" checked><span class="swatch line" style="background:#FFB74D"></span><span class="lbl">SSL 船舶</span></label>
        </div>
    </div>
    <div id="layersReopen" class="reopen-tab" title="展开图层">☰</div>

    <!-- Stats panel (right) -->
    <div id="statsPanel" class="glass side-panel">
        <div class="panel-header">
            <span>统计</span>
            <button class="collapse-btn" id="statsCollapse" title="收起">›</button>
        </div>
        <div class="panel-body">
            <div class="stat-row"><span class="k">卫星</span><span class="v" id="satCount">0</span></div>
            <div class="stat-row"><span class="k">无人机</span><span class="v" id="uavCount">0</span></div>
            <div class="stat-row"><span class="k">船舶</span><span class="v" id="shipCount">0</span></div>
            <div class="stat-row"><span class="k">地面站</span><span class="v" id="staCount">0</span></div>
            <div class="stat-row"><span class="k">链路</span><span class="v" id="linkCount">0</span></div>
            <div class="stat-row"><span class="k">帧率</span><span class="v" id="fpsCounter">0</span></div>
            <div id="metricsSummary">等待数据…</div>
        </div>
    </div>
    <div id="statsReopen" class="reopen-tab" title="展开统计">📊</div>

    <!-- Detail panel (right, shown on selection) -->
    <div id="detailPanel" class="glass side-panel">
        <div class="panel-header">
            <span id="detailTitle">详情</span>
            <button class="collapse-btn" id="detailClose" title="关闭">×</button>
        </div>
        <div class="panel-body" id="detailBody"></div>
    </div>

    <!-- Bottom playback bar -->
    <div id="playbackBar" class="glass">
        <button class="pb-btn primary" id="playPauseBtn" title="播放/暂停">▶</button>
        <button class="pb-btn" id="stopBtn" title="停止">⏹</button>
        <span id="simTime">0s</span>
        <input type="range" id="timelineSlider" min="0" max="600" value="0" step="1">
        <select id="speedSelect" title="播放速度">
            <option value="0.5">0.5x</option>
            <option value="1" selected>1x</option>
            <option value="2">2x</option>
            <option value="5">5x</option>
            <option value="10">10x</option>
        </select>
    </div>

    <!-- Hint toast -->
    <div id="hintToast">点击链路或节点查看实时状态 · 右键取消选择</div>

    <!-- JavaScript Modules -->
    <script src="../js/websocket.js?v=3b0"></script>
    <script src="../js/cesium-manager.js?v=3b0"></script>
    <script src="../js/ui-controller.js?v=3b0"></script>
    <script src="../js/app.js?v=3b0"></script>
</body>
</html>
