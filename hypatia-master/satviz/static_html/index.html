<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>空天海多域网络可视化</title>

    <!-- CesiumJS 1.141 -->
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.141/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.141/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

    <style>
        :root {
            --bg-glass: rgba(13, 17, 28, 0.82);
            --bg-glass-hover: rgba(20, 26, 42, 0.9);
            --border: rgba(255, 255, 255, 0.08);
            --accent: #38bdf8;
            --text: #e6edf3;
            --text-dim: #8b98a9;
            --good: #34d399;
            --warn: #fbbf24;
            --bad: #f87171;
            --radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            background: #000;
            color: var(--text);
        }

        #cesiumContainer { width: 100%; height: 100%; position: relative; }

        /* Hide Cesium default credit container clutter */
        .cesium-viewer-bottom { display: none; }

        /* Cesium 自带工具条（home/全屏）紧邻右上“已连接”徽章左侧，避免重叠 */
        .cesium-viewer-toolbar { top: 14px; right: 110px; }

        /* ---------- Glass panel base ---------- */
        .glass {
            position: absolute;
            background: var(--bg-glass);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
            z-index: 20;
            color: var(--text);
        }

        /* ---------- Top bar ---------- */
        #topBar {
            position: absolute;
            top: 14px; left: 14px; right: 14px;
            display: flex;
            justify-content: flex-start;
            gap: 10px;
            align-items: center;
            z-index: 20;
            pointer-events: none;
        }
        #brand {
            pointer-events: auto;
            background: var(--bg-glass);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            backdrop-filter: blur(14px);
            padding: 9px 16px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        #brand .sub {
            font-size: 11px;
            font-weight: 400;
            color: var(--text-dim);
            margin-left: 8px;
        }
        #connChip {
            margin-left: auto;
            pointer-events: auto;
            background: var(--bg-glass);
            border: 1px solid var(--border);
            border-radius: 999px;
            backdrop-filter: blur(14px);
            padding: 7px 14px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 7px;
        }
        .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--bad);
            box-shadow: 0 0 6px var(--bad);
        }
        .dot.on { background: var(--good); box-shadow: 0 0 6px var(--good); }

        /* ---------- Side panels (layers / stats / detail) ---------- */
        .side-panel {
            width: 230px;
            overflow: hidden;
            transition: transform 0.28s cubic-bezier(.4,0,.2,1), opacity 0.28s;
        }
        /* 左/右列面板限高 + 内部滚动，保证任意视屏高度下上下不重叠 */
        #layersPanel {
            left: 14px; top: 70px;
            max-height: calc(100vh - 380px);
            display: flex; flex-direction: column;
        }
        #layersPanel .panel-body { overflow-y: auto; min-height: 0; }
        #statsPanel  {
            right: 14px; top: 70px;
            max-height: 42vh;
            display: flex; flex-direction: column;
        }
        #statsPanel .panel-body { overflow-y: auto; min-height: 0; }
        #detailPanel { right: 14px; top: 70px; width: 280px; display: none; }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 11px 14px;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text);
            border-bottom: 1px solid var(--border);
            user-select: none;
        }
        .panel-header .collapse-btn {
            background: none; border: none; color: var(--text-dim);
            cursor: pointer; font-size: 15px; line-height: 1;
            padding: 2px 4px; border-radius: 4px;
        }
        .panel-header .collapse-btn:hover { color: var(--text); background: rgba(255,255,255,0.08); }
        .panel-body { padding: 12px 14px; }

        .side-panel.collapsed .panel-body { display: none; }
        .side-panel.collapsed { width: auto; }

        /* Re-open tab shown when collapsed */
        .reopen-tab {
            position: absolute;
            top: 70px;
            background: var(--bg-glass);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            backdrop-filter: blur(14px);
            padding: 8px 10px;
            cursor: pointer;
            z-index: 19;
            font-size: 13px;
            color: var(--text-dim);
            display: none;
        }
        .reopen-tab:hover { color: var(--text); }
        #layersReopen { left: 14px; }
        #statsReopen  { right: 14px; }

        /* ---------- Layer legend items ---------- */
        .layer-group-label {
            font-size: 10.5px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            margin: 10px 0 6px;
        }
        .layer-group-label:first-child { margin-top: 0; }
        .layer-item {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 5px 6px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 12.5px;
            transition: background 0.15s;
        }
        .layer-item:hover { background: rgba(255,255,255,0.06); }
        .layer-item input { display: none; }
        .layer-item .swatch {
            width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0;
            box-shadow: 0 0 5px rgba(0,0,0,0.4);
            position: relative;
        }
        .layer-item .swatch.line { height: 3px; border-radius: 2px; width: 16px; }
        .layer-item input:not(:checked) ~ .swatch { opacity: 0.25; }
        .layer-item input:not(:checked) ~ .lbl { color: var(--text-dim); text-decoration: line-through; }
        .layer-item .lbl { flex: 1; }

        /* ---------- Stats ---------- */
        .stat-row {
            display: flex;
            justify-content: space-between;
            font-size: 12.5px;
            padding: 3.5px 0;
        }
        .stat-row .k { color: var(--text-dim); }
        .stat-row .v { font-weight: 600; font-variant-numeric: tabular-nums; }
        #metricsSummary {
            margin-top: 9px;
            padding-top: 9px;
            border-top: 1px solid var(--border);
            font-size: 11px;
            line-height: 1.6;
            color: var(--text-dim);
        }

        /* ---------- Coloring-mode select ---------- */
        .mode-select {
            width: 100%;
            background: rgba(255,255,255,0.08);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 8px;
            font-size: 12px;
            cursor: pointer;
        }
        .mode-select option { background: #161b27; }

        /* ---------- Time-series chart panel ---------- */
        #chartPanel { left: 14px; bottom: 22px; width: 250px; }
        #chartReopen { left: 14px; bottom: 22px; top: auto; }
        .chart-block { margin-bottom: 7px; }
        .chart-block:last-child { margin-bottom: 0; }
        .chart-title {
            font-size: 10.5px;
            letter-spacing: 0.5px;
            margin-bottom: 3px;
            font-weight: 600;
        }
        .ts-chart {
            width: 100%;
            height: 48px;
            display: block;
            background: rgba(0,0,0,0.28);
            border-radius: 6px;
        }

        /* ---------- Detail panel ---------- */
        .detail-type-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .detail-endpoints {
            font-size: 12.5px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 8px 10px;
            margin-bottom: 12px;
            line-height: 1.5;
            word-break: break-all;
        }
        .detail-endpoints .arrow { color: var(--accent); margin: 0 6px; }
        .metric-block { margin-bottom: 11px; }
        .metric-block .metric-label {
            display: flex; justify-content: space-between;
            font-size: 11.5px; color: var(--text-dim); margin-bottom: 5px;
        }
        .metric-block .metric-label .mv { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
        .progress-track {
            height: 6px; border-radius: 3px;
            background: rgba(255,255,255,0.1);
            overflow: hidden;
        }
        .progress-fill {
            height: 100%; border-radius: 3px;
            background: linear-gradient(90deg, var(--good), var(--warn), var(--bad));
            width: 0%;
            transition: width 0.3s ease;
        }
        .detail-status {
            display: flex; align-items: center; gap: 7px;
            font-size: 12px; margin-top: 4px;
        }

        /* ---------- Bottom playback bar ---------- */
        #playbackBar {
            left: 50%;
            transform: translateX(-50%);
            bottom: 22px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            width: min(680px, calc(100vw - 40px));
        }
        .pb-btn {
            width: 36px; height: 36px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.1);
            color: var(--text);
            cursor: pointer;
            font-size: 14px;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.15s, transform 0.1s;
            flex-shrink: 0;
        }
        .pb-btn:hover { background: rgba(255,255,255,0.2); }
        .pb-btn:active { transform: scale(0.94); }
        .pb-btn.primary { background: var(--accent); color: #04121f; }
        .pb-btn.primary:hover { background: #67d3fb; }

        #simTime {
            font-size: 13px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            min-width: 52px;
            text-align: center;
            color: var(--accent);
        }

        #timelineSlider { flex: 1; min-width: 80px; }

        input[type="range"] {
            -webkit-appearance: none;
            height: 5px;
            border-radius: 3px;
            background: rgba(255,255,255,0.15);
            outline: none;
            cursor: pointer;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px; height: 14px; border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 6px rgba(56,189,248,0.6);
            cursor: pointer;
        }
        input[type="range"]::-moz-range-thumb {
            width: 14px; height: 14px; border-radius: 50%;
            background: var(--accent); border: none; cursor: pointer;
        }

        #speedSelect, #constellationSelect {
            background: rgba(255,255,255,0.1);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 8px;
            font-size: 12px;
            cursor: pointer;
            flex-shrink: 0;
        }
        #speedSelect option, #constellationSelect option { background: #161b27; }
        #constellationSelect { max-width: 168px; }

        /* ---------- Custom constellation panel (可选星座) ---------- */
        #constellationPanel {
            left: 50%;
            transform: translateX(-50%);
            bottom: 84px;
            width: 320px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 60;
        }
        #constellationPanel .cp-title { font-size: 13px; font-weight: 600; }
        #constellationPanel .cp-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
        }
        #constellationPanel label {
            display: flex; flex-direction: column; gap: 4px;
            font-size: 11px; color: var(--text-dim);
        }
        #constellationPanel input {
            background: rgba(255,255,255,0.08);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            padding: 5px 7px;
            font-size: 12px;
            width: 100%;
            box-sizing: border-box;
        }
        #constellationPanel .cp-hint { font-size: 11px; color: var(--text-dim); }
        #constellationPanel .cp-actions {
            display: flex; gap: 8px; justify-content: flex-end;
        }

        /* ---------- File transfer panel (Milestone A, C期) ---------- */
        #filePanel { right: 14px; top: calc(70px + 42vh + 12px); width: 300px; max-height: calc(58vh - 104px); display: flex; flex-direction: column; }
        #filePanel .panel-body { overflow-y: auto; min-height: 0; }
        #fileReopen { right: 14px; top: calc(70px + 42vh + 12px); }
        .file-form { display: flex; flex-direction: column; gap: 7px; padding-bottom: 10px; border-bottom: 1px solid var(--border); margin-bottom: 10px; }
        .file-form .f-row { display: flex; gap: 7px; }
        .file-form .f-field { flex: 1; display: flex; flex-direction: column; gap: 3px; }
        .file-form label { font-size: 10.5px; color: var(--text-dim); letter-spacing: 0.5px; }
        .file-form select, .file-form input[type="number"] {
            width: 100%; background: rgba(255,255,255,0.08); color: var(--text);
            border: 1px solid var(--border); border-radius: 7px; padding: 5px 7px; font-size: 12px;
        }
        .file-form select option { background: #161b27; }
        /* Milestone C: satellite locate row (number -> jump to a satellite) */
        .file-form .sat-locate { align-items: flex-end; }
        .file-form .sat-locate input[type="text"] {
            width: 100%; background: rgba(255,255,255,0.08); color: var(--text);
            border: 1px solid var(--border); border-radius: 7px; padding: 5px 7px; font-size: 12px;
        }
        .file-form .sat-locate input[type="text"].loc-ok { border-color: #4ade80; }
        .file-form .sat-locate input[type="text"].loc-bad { border-color: #f87171; }
        .file-form .locate-btn {
            background: rgba(255,255,255,0.10); color: var(--text); border: 1px solid var(--border);
            border-radius: 7px; padding: 5px 8px; font-size: 11.5px; cursor: pointer;
            white-space: nowrap; transition: background 0.15s;
        }
        .file-form .locate-btn:hover { background: rgba(255,255,255,0.22); }
        .file-pick {
            display: flex; align-items: center; gap: 8px; cursor: pointer;
            background: rgba(255,255,255,0.06); border: 1px dashed var(--border);
            border-radius: 8px; padding: 8px 10px; font-size: 12px; color: var(--text-dim);
            transition: background 0.15s;
        }
        .file-pick:hover { background: rgba(255,255,255,0.12); color: var(--text); }
        .file-pick.has-file { color: var(--text); border-style: solid; }
        .file-pick .fname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .file-pick .fsize { color: var(--text-dim); font-size: 11px; }
        .file-send-btn {
            background: var(--accent); color: #04121f; border: none; border-radius: 8px;
            padding: 8px; font-size: 12.5px; font-weight: 600; cursor: pointer; transition: background 0.15s;
        }
        .file-send-btn:hover { background: #67d3fb; }
        .file-send-btn:disabled { background: rgba(255,255,255,0.12); color: var(--text-dim); cursor: not-allowed; }
        .file-list { display: flex; flex-direction: column; gap: 8px; }
        .file-empty { font-size: 11.5px; color: var(--text-dim); text-align: center; padding: 8px 0; }
        .file-card {
            background: rgba(255,255,255,0.05); border: 1px solid var(--border);
            border-radius: 9px; padding: 9px 10px; cursor: pointer; transition: background 0.15s, border-color 0.15s;
        }
        .file-card:hover { background: rgba(255,255,255,0.09); }
        .file-card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
        .file-card .fc-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
        .file-card .fc-name { font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
        .file-card .fc-badge { font-size: 10px; padding: 2px 7px; border-radius: 999px; font-weight: 600; flex-shrink: 0; }
        .fc-badge.TRANSFERRING { background: rgba(56,189,248,0.18); color: var(--accent); }
        .fc-badge.COMPLETE { background: rgba(52,211,153,0.18); color: var(--good); }
        .fc-badge.CANCELLED { background: rgba(139,152,169,0.18); color: var(--text-dim); }
        .fc-badge.STORED { background: rgba(251,191,36,0.18); color: var(--warn); }
        .file-card .fc-bar { height: 5px; border-radius: 3px; background: rgba(255,255,255,0.1); overflow: hidden; margin-bottom: 6px; }
        .file-card .fc-bar > div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--good)); border-radius: 3px; transition: width 0.3s; }
        .file-card .fc-meta { font-size: 10.5px; color: var(--text-dim); line-height: 1.5; font-variant-numeric: tabular-nums; }
        .file-card .fc-meta b { color: var(--text); font-weight: 600; }
        .file-card .fc-path { font-size: 10px; color: var(--text-dim); margin-top: 3px; word-break: break-all; }
        .file-card .fc-actions { display: flex; gap: 6px; margin-top: 7px; }
        .file-card .fc-actions button {
            flex: 1; font-size: 11px; padding: 4px 6px; border-radius: 6px; cursor: pointer;
            border: 1px solid var(--border); background: rgba(255,255,255,0.07); color: var(--text);
        }
        .file-card .fc-actions button:hover { background: rgba(255,255,255,0.16); }
        .file-card .fc-actions button.dl { background: rgba(52,211,153,0.16); color: var(--good); border-color: rgba(52,211,153,0.4); }
        .file-card .fc-actions button.cancel { color: var(--bad); }

        /* ---------- Experiment lab entry (改进 #2，跳转 lab.html) ---------- */
        #expBtn {
            position: static; /* 覆盖 .glass 的 absolute，回归顶栏 flex 流 */
            pointer-events: auto;
            border: 1px solid rgba(56,189,248,0.55);
            background: rgba(56,189,248,0.16);
            color: var(--accent);
            font-weight: 600;
            border-radius: 999px;
            padding: 7px 14px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.15s;
        }
        #expBtn:hover { background: rgba(56,189,248,0.32); }

        /* ---------- Hint toast ---------- */
        #hintToast {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 86px;
            background: var(--bg-glass);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 7px 16px;
            font-size: 12px;
            color: var(--text-dim);
            z-index: 18;
            backdrop-filter: blur(14px);
            pointer-events: none;
            opacity: 1;
            transition: opacity 0.6s;
        }
        #hintToast.hide { opacity: 0; }

        /* ---------- 断线遮罩 (P1) ---------- */
        #connOverlay {
            position: fixed;
            inset: 0;
            background: rgba(5, 8, 16, 0.74);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            z-index: 60;
            display: none;
            align-items: center;
            justify-content: center;
        }
        #connOverlay .co-card {
            background: var(--bg-glass);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            padding: 26px 34px;
            text-align: center;
            max-width: 360px;
        }
        #connOverlay .co-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
        #connOverlay .co-msg { font-size: 12.5px; color: var(--text-dim); margin-bottom: 18px; line-height: 1.7; }
        #connOverlay .co-btn {
            background: var(--accent); color: #04121f; border: none; border-radius: 8px;
            padding: 9px 22px; font-size: 13px; font-weight: 600; cursor: pointer;
            transition: background 0.15s;
        }
        #connOverlay .co-btn:hover { background: #67d3fb; }

        /* ---------- Toast 提示 (P1，替代 alert) ---------- */
        #appToast {
            position: absolute;
            top: 64px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-glass);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 8px 18px;
            font-size: 12.5px;
            z-index: 50;
            backdrop-filter: blur(14px);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            max-width: 70vw;
        }
        #appToast.show { opacity: 1; }
        #appToast.ok { color: var(--good); }
        #appToast.bad { color: var(--bad); }

        /* ---------- 小屏响应式适配 (P1) ---------- */
        @media (max-width: 900px) {
            #brand .sub { display: none; }
            #chartPanel { display: none; }
            #chartReopen { display: none !important; }
            #filePanel { top: auto; bottom: 92px; max-height: 40vh; width: 280px; }
            #fileReopen { top: auto; bottom: 92px; }
            #detailPanel { width: min(280px, calc(100vw - 28px)); }
        }
        @media (max-width: 600px) {
            #layersPanel { display: none; }
            #layersReopen { display: none !important; }
            #playbackBar { gap: 8px; padding: 8px 10px; bottom: 14px; }
            #hintToast { display: none; }
        }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>

    <!-- Top bar -->
    <div id="topBar">
        <div id="brand">空天海多域网络可视化<span class="sub">CesiumJS 1.141 · Protocol v2</span></div>
        <div id="connChip">
            <span class="dot" id="connectionIndicator"></span>
            <span id="connectionStatus">未连接</span>
        </div>
    </div>

    <!-- Layers panel (left) -->
    <div id="layersPanel" class="glass side-panel">
        <div class="panel-header">
            <span>图层</span>
            <button class="collapse-btn" id="layersCollapse" title="收起">‹</button>
        </div>
        <div class="panel-body">
            <div class="layer-group-label">节点</div>
            <label class="layer-item"><input type="checkbox" id="toggleSatellite" checked><span class="swatch" style="background:#1E90FF"></span><span class="lbl">卫星</span></label>
            <label class="layer-item"><input type="checkbox" id="toggleUav" checked><span class="swatch" style="background:#32CD32"></span><span class="lbl">无人机</span></label>
            <label class="layer-item"><input type="checkbox" id="toggleShip" checked><span class="swatch" style="background:#FFA500"></span><span class="lbl">船舶</span></label>
            <label class="layer-item"><input type="checkbox" id="toggleRealShip" checked><span class="swatch" style="background:#26A69A"></span><span class="lbl">真实船舶(AIS)</span></label>
            <label class="layer-item"><input type="checkbox" id="toggleGroundStation" checked><span class="swatch" style="background:#FF4500"></span><span class="lbl">地面站</span></label>
            <div class="layer-group-label">链路</div>
            <label class="layer-item"><input type="checkbox" id="toggleISL" checked><span class="swatch line" style="background:#4FC3F7"></span><span class="lbl">ISL 星间</span></label>
            <label class="layer-item"><input type="checkbox" id="toggleGSL" checked><span class="swatch line" style="background:#FF8A65"></span><span class="lbl">GSL 地面</span></label>
            <label class="layer-item"><input type="checkbox" id="toggleSUL" checked><span class="swatch line" style="background:#81C784"></span><span class="lbl">SUL 无人机</span></label>
            <label class="layer-item"><input type="checkbox" id="toggleSSL" checked><span class="swatch line" style="background:#FFB74D"></span><span class="lbl">SSL 船舶</span></label>
            <div class="layer-group-label">链路着色</div>
            <select id="metricsModeSelect" class="mode-select" title="按指标为链路着色">
                <option value="none" selected>按类型（默认）</option>
                <option value="bandwidth">按吞吐利用率</option>
                <option value="queue">按队列深度</option>
                <option value="latency">按时延</option>
                <option value="loss_rate">按丢包率</option>
            </select>
            <div class="layer-group-label">动画</div>
            <label class="layer-item"><input type="checkbox" id="packetFlowToggle" checked><span class="swatch" style="background:#FFFFFF"></span><span class="lbl">包流动动画</span></label>
        </div>
    </div>
    <div id="layersReopen" class="reopen-tab" title="展开图层">☰</div>

    <!-- Stats panel (right) -->
    <div id="statsPanel" class="glass side-panel">
        <div class="panel-header">
            <span>统计</span>
            <button class="collapse-btn" id="statsCollapse" title="收起">›</button>
        </div>
        <div class="panel-body">
            <div class="stat-row"><span class="k">卫星</span><span class="v" id="satCount">0</span></div>
            <div class="stat-row"><span class="k">无人机</span><span class="v" id="uavCount">0</span></div>
            <div class="stat-row"><span class="k">船舶</span><span class="v" id="shipCount">0</span></div>
            <div class="stat-row"><span class="k">真实船舶(AIS)</span><span class="v" id="realShipCount">0</span></div>
            <div class="stat-row"><span class="k">地面站</span><span class="v" id="staCount">0</span></div>
            <div class="stat-row"><span class="k">链路</span><span class="v" id="linkCount">0</span></div>
            <div class="stat-row"><span class="k">帧率</span><span class="v" id="fpsCounter">0</span></div>
            <div class="stat-row"><span class="k">渲染诊断</span><span class="v" id="renderDiag" style="font-size:10.5px">--</span></div>
            <div id="metricsSummary">等待数据…</div>
        </div>
    </div>
    <div id="statsReopen" class="reopen-tab" title="展开统计">📊</div>

    <!-- Detail panel (right, shown on selection) -->
    <div id="detailPanel" class="glass side-panel">
        <div class="panel-header">
            <span id="detailTitle">详情</span>
            <button class="collapse-btn" id="detailClose" title="关闭">×</button>
        </div>
        <div class="panel-body" id="detailBody"></div>
    </div>

    <!-- File transfer panel (right, Milestone A C期) -->
    <div id="filePanel" class="glass side-panel">
        <div class="panel-header">
            <span>文件传输</span>
            <button class="collapse-btn" id="fileCollapse" title="收起">›</button>
        </div>
        <div class="panel-body">
            <div class="file-form">
                <label class="file-pick" id="filePick">
                    <input type="file" id="fileInput" style="display:none">
                    <span>📁</span>
                    <span class="fname" id="fileName">选择要传输的文件…</span>
                    <span class="fsize" id="fileSize"></span>
                </label>
                <div class="f-row">
                    <div class="f-field">
                        <label>源端</label>
                        <select id="fileSrc"></select>
                    </div>
                    <div class="f-field">
                        <label>目的端</label>
                        <select id="fileDst"></select>
                    </div>
                </div>
                <div class="f-row sat-locate">
                    <div class="f-field">
                        <label>卫星定位</label>
                        <input type="text" id="satLocate" placeholder="编号如 123 或 5-3">
                    </div>
                    <button class="locate-btn" id="satToSrc" title="将定位到的卫星设为源端">→源</button>
                    <button class="locate-btn" id="satToDst" title="将定位到的卫星设为目的端">→目的</button>
                </div>
                <div class="f-row">
                    <div class="f-field">
                        <label>优先级</label>
                        <select id="filePrio">
                            <option value="0">高 (UAV)</option>
                            <option value="1" selected>尽力 (ship)</option>
                        </select>
                    </div>
                    <div class="f-field">
                        <label>速率上限 (Mbps)</label>
                        <input type="number" id="fileRate" value="5" min="0.1" step="0.1">
                    </div>
                </div>
                <button class="file-send-btn" id="fileSendBtn" disabled>上传并发送</button>
            </div>
            <div class="file-list" id="fileList">
                <div class="file-empty">暂无传输任务</div>
            </div>
        </div>
    </div>
    <div id="fileReopen" class="reopen-tab" title="展开文件传输">📄</div>

    <!-- Time-series charts panel (bottom-left) -->
    <div id="chartPanel" class="glass side-panel">
        <div class="panel-header">
            <span>时序指标</span>
            <button class="collapse-btn" id="chartCollapse" title="收起">‹</button>
        </div>
        <div class="panel-body">
            <div class="chart-block"><div class="chart-title" style="color:#38bdf8">吞吐 (Mbps)</div><canvas id="chartThroughput" class="ts-chart"></canvas></div>
            <div class="chart-block"><div class="chart-title" style="color:#fbbf24">端到端时延 (ms)</div><canvas id="chartLatency" class="ts-chart"></canvas></div>
            <div class="chart-block"><div class="chart-title" style="color:#f87171">丢包 (pkt/s)</div><canvas id="chartLoss" class="ts-chart"></canvas></div>
        </div>
    </div>
    <div id="chartReopen" class="reopen-tab" title="展开时序图">📈</div>

    <!-- Bottom playback bar -->
    <div id="playbackBar" class="glass">
        <button class="pb-btn primary" id="playPauseBtn" title="播放/暂停">▶</button>
        <button class="pb-btn" id="stopBtn" title="停止">⏹</button>
        <span id="simTime">0s</span>
        <input type="range" id="timelineSlider" min="0" max="600" value="0" step="1">
        <select id="speedSelect" title="播放速度">
            <option value="0.5">0.5x</option>
            <option value="1" selected>1x</option>
            <option value="2">2x</option>
            <option value="5">5x</option>
            <option value="10">10x</option>
        </select>
        <select id="constellationSelect" title="选择星座（切换后自动重建场景）">
            <option value="demo72" selected>演示 72 星</option>
            <option value="demo440">演示 440 星</option>
            <option value="starlink">Starlink 1584 星</option>
            <option value="kuiper">Kuiper 1156 星</option>
            <option value="telesat">Telesat 351 星</option>
            <option value="custom">自定义…</option>
        </select>
    </div>

    <!-- Custom constellation parameters (可选星座) -->
    <div id="constellationPanel" class="glass" style="display:none;">
        <div class="cp-title">自定义星座（Walker-δ 单壳层）</div>
        <div class="cp-grid">
            <label>轨道面数 <input type="number" id="cpPlanes" min="1" max="80" value="12"></label>
            <label>每面星数 <input type="number" id="cpSatsPerPlane" min="1" max="40" value="12"></label>
            <label>高度 (km) <input type="number" id="cpAltitude" min="300" max="2000" step="10" value="550"></label>
            <label>倾角 (°) <input type="number" id="cpInclination" min="0" max="120" step="0.1" value="53"></label>
        </div>
        <div class="cp-hint">总星数上限 1600；应用后仿真时间归零并重建场景</div>
        <div class="cp-actions">
            <button class="pb-btn primary" id="cpApply">应用</button>
            <button class="pb-btn" id="cpCancel">取消</button>
        </div>
    </div>

    <!-- Hint toast -->
    <div id="hintToast">点击链路或节点查看实时状态 · 右键取消选择</div>

    <!-- 断线遮罩 (P1)：断线时全屏提示，自动重连耗尽后提供手动重连 -->
    <div id="connOverlay">
        <div class="co-card">
            <div class="co-title">⚠ 连接已断开</div>
            <div class="co-msg" id="connOverlayMsg">正在自动重连…</div>
            <button class="co-btn" id="reconnectBtn">立即重连</button>
        </div>
    </div>

    <!-- Toast 提示 (P1) -->
    <div id="appToast"></div>


    <!-- JavaScript Modules -->
    <script src="../js/config.js?v=3kd"></script>
    <script src="../js/constants.js?v=3kd"></script>
    <script src="../js/websocket.js?v=3kd"></script>
    <script src="../js/experiment.js?v=3kd"></script>
    <script src="../js/chart.js?v=3kd"></script>
    <script src="../js/packet-flow.js?v=3kd"></script>
    <script src="../js/protocol31.js?v=3kd"></script>
    <script src="../js/cesium-manager.js?v=3kd"></script>
    <script src="../js/ui-controller.js?v=3kd"></script>
    <script src="../js/app.js?v=3kd"></script>
</body>
</html>
