<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>空天海多域网络可视化</title>

    <!-- CesiumJS 1.141 -->
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.141/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.141/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

    <style>
        :root {
            --bg-glass: rgba(13, 17, 28, 0.82);
            --bg-glass-hover: rgba(20, 26, 42, 0.9);
            --border: rgba(255, 255, 255, 0.08);
            --accent: #38bdf8;
            --text: #e6edf3;
            --text-dim: #8b98a9;
            --good: #34d399;
            --warn: #fbbf24;
            --bad: #f87171;
            --radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            background: #000;
            color: var(--text);
        }

        #cesiumContainer { width: 100%; height: 100%; position: relative; }

        /* Hide Cesium default credit container clutter */
        .cesium-viewer-bottom { display: none; }

        /* Cesium 自带工具条（home/全屏）紧邻右上“已连接”徽章左侧，避免重叠 */
        .cesium-viewer-toolbar { top: 14px; right: 110px; }

        /* ---------- Glass panel base ---------- */
        .glass {
            position: absolute;
            background: var(--bg-glass);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
            z-index: 20;
            color: var(--text);
        }

        /* ---------- Top bar ---------- */
        #topBar {
            position: absolute;
            top: 14px; left: 14px; right: 14px;
            display: flex;
            justify-content: flex-start;
            gap: 10px;
            align-items: center;
            z-index: 20;
            pointer-events: none;
        }
        #brand {
            pointer-events: auto;
            background: var(--bg-glass);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            backdrop-filter: blur(14px);
            padding: 9px 16px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        #brand .sub {
            font-size: 11px;
            font-weight: 400;
            color: var(--text-dim);
            margin-left: 8px;
        }
        #connChip {
            margin-left: auto;
            pointer-events: auto;
            background: var(--bg-glass);
            border: 1px solid var(--border);
            border-radius: 999px;
            backdrop-filter: blur(14px);
            padding: 7px 14px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 7px;
        }
        .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--bad);
            box-shadow: 0 0 6px var(--bad);
        }
        .dot.on { background: var(--good); box-shadow: 0 0 6px var(--good); }

        /* ---------- Side panels (layers / stats / detail) ---------- */
        .side-panel {
            width: 230px;
            overflow: hidden;
            transition: transform 0.28s cubic-bezier(.4,0,.2,1), opacity 0.28s;
        }
        /* 左/右列面板限高 + 内部滚动，保证任意视屏高度下上下不重叠 */
        #layersPanel {
            left: 14px; top: 70px;
            max-height: calc(100vh - 380px);
            display: flex; flex-direction: column;
        }
        #layersPanel .panel-body { overflow-y: auto; min-height: 0; }
        #statsPanel  {
            right: 14px; top: 70px;
            max-height: 42vh;
            display: flex; flex-direction: column;
        }
        #statsPanel .panel-body { overflow-y: auto; min-height: 0; }
        #detailPanel { right: 14px; top: 70px; width: 280px; display: none; }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 11px 14px;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text);
            border-bottom: 1px solid var(--border);
            user-select: none;
        }
        .panel-header .collapse-btn {
            background: none; border: none; color: var(--text-dim);
            cursor: pointer; font-size: 15px; line-height: 1;
            padding: 2px 4px; border-radius: 4px;
        }
        .panel-header .collapse-btn:hover { color: var(--text); background: rgba(255,255,255,0.08); }
        .panel-body { padding: 12px 14px; }

        .side-panel.collapsed .panel-body { display: none; }
        .side-panel.collapsed { width: auto; }

        /* Re-open tab shown when collapsed */
        .reopen-tab {
            position: absolute;
            top: 70px;
            background: var(--bg-glass);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            backdrop-filter: blur(14px);
            padding: 8px 10px;
            cursor: pointer;
            z-index: 19;
            font-size: 13px;
            color: var(--text-dim);
            display: none;
        }
        .reopen-tab:hover { color: var(--text); }
        #layersReopen { left: 14px; }
        #statsReopen  { right: 14px; }

        /* ---------- Layer legend items ---------- */
        .layer-group-label {
            font-size: 10.5px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            margin: 10px 0 6px;
        }
        .layer-group-label:first-child { margin-top: 0; }
        .layer-item {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 5px 6px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 12.5px;
            transition: background 0.15s;
        }
        .layer-item:hover { background: rgba(255,255,255,0.06); }
        .layer-item input { display: none; }
        .layer-item .swatch {
            width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0;
            box-shadow: 0 0 5px rgba(0,0,0,0.4);
            position: relative;
        }
        .layer-item .swatch.line { height: 3px; border-radius: 2px; width: 16px; }
        .layer-item input:not(:checked) ~ .swatch { opacity: 0.25; }
        .layer-item input:not(:checked) ~ .lbl { color: var(--text-dim); text-decoration: line-through; }
        .layer-item .lbl { flex: 1; }

        /* ---------- Stats ---------- */
        .stat-row {
            display: flex;
            justify-content: space-between;
            font-size: 12.5px;
            padding: 3.5px 0;
        }
        .stat-row .k { color: var(--text-dim); }
        .stat-row .v { font-weight: 600; font-variant-numeric: tabular-nums; }
        #metricsSummary {
            margin-top: 9px;
            padding-top: 9px;
            border-top: 1px solid var(--border);
            font-size: 11px;
            line-height: 1.6;
            color: var(--text-dim);
        }

        /* ---------- Coloring-mode select ---------- */
        .mode-select {
            width: 100%;
            background: rgba(255,255,255,0.08);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 8px;
            font-size: 12px;
            cursor: pointer;
        }
        .mode-select option { background: #161b27; }

        /* ---------- Time-series chart panel ---------- */
        /* 拖动上边缘（面板头部）即可移动面板；双击头部恢复联动定位；最近操作的面板置顶 */
        #layersPanel .panel-header, #statsPanel .panel-header,
        #chartPanel .panel-header, #filePanel .panel-header,
        #detailPanel .panel-header { cursor: grab; touch-action: none; user-select: none; }
        /* 自定义星座面板无 .panel-header，以标题行作拖动手柄 */
        #constellationPanel .cp-title { cursor: grab; touch-action: none; user-select: none; }
        .glass.dragging { transition: none; }
        .glass.dragging .panel-header, .glass.dragging .cp-title { cursor: grabbing; }
        /* 面板缩放手柄：悬停左/右边缘显示 ew-resize，下边缘显示 ns-resize（手柄由脚本动态注入） */
        .resize-handle { position: absolute; z-index: 5; touch-action: none; user-select: none; }
        .resize-handle.rh-left   { top: 0; left: 0;  width: 6px;  height: 100%; cursor: ew-resize; }
        .resize-handle.rh-right  { top: 0; right: 0; width: 6px;  height: 100%; cursor: ew-resize; }
        .resize-handle.rh-bottom { left: 0; bottom: 0; width: 100%; height: 6px; cursor: ns-resize; }
        .glass.resizing { transition: none; }
        /* 几何约束：时序指标上边缘位于「图层」(#layersPanel) 下边缘下方 14px（--panel-gap），
           且右边缘与图层面板右边缘完全对齐（右侧边界重合）。
           layersPanel 实际高度随内容变化、收起时 display:none，故由页尾 syncPanelGeometry
           脚本按实测矩形动态联动；隐藏/收起时回退为以下相对计算值（70px + 图层 max-height）。 */
        #chartPanel {
            top: calc(100vh - 310px + var(--panel-gap));
            right: calc(100vw - var(--panel-side) - var(--panel-width));
            left: auto;
            bottom: auto;
            width: var(--panel-width);
        }
        #chartReopen {
            top: calc(100vh - 310px + var(--panel-gap));
            right: calc(100vw - var(--panel-side) - var(--panel-width));
            left: auto;
            bottom: auto;
        }
        .chart-block { margin-bottom: 7px; }
        .chart-block:last-child { margin-bottom: 0; }
        .chart-title {
            font-size: 10.5px;
            letter-spacing: 0.5px;
            margin-bottom: 3px;
            font-weight: 600;
        }
        .ts-chart {
            width: 100%;
            height: 48px;
            display: block;
            background: rgba(0,0,0,0.28);
            border-radius: 6px;
        }

        /* ---------- Detail panel ---------- */
        .detail-type-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .detail-endpoints {
            font-size: 12.5px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 8px 10px;
            margin-bottom: 12px;
            line-height: 1.5;
            word-break: break-all;
        }
        .detail-endpoints .arrow { color: var(--accent); margin: 0 6px; }
        .metric-block { margin-bottom: 11px; }
        .metric-block .metric-label {
            display: flex; justify-content: space-between;
            font-size: 11.5px; color: var(--text-dim); margin-bottom: 5px;
        }
        .metric-block .metric-label .mv { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
        .progress-track {
            height: 6px; border-radius: 3px;
            background: rgba(255,255,255,0.1);
            overflow: hidden;
        }
        .progress-fill {
            height: 100%; border-radius: 3px;
            background: linear-gradient(90deg, var(--good), var(--warn), var(--bad));
            width: 0%;
            transition: width 0.3s ease;
        }
        .detail-status {
            display: flex; align-items: center; gap: 7px;
            font-size: 12px; margin-top: 4px;
        }

        /* ---------- Bottom playback bar ---------- */
        #playbackBar {
            left: 50%;
            transform: translateX(-50%);
            bottom: 22px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            width: min(680px, calc(100vw - 40px));
        }
        .pb-btn {
            width: 36px; height: 36px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.1);
            color: var(--text);
            cursor: pointer;
            font-size: 14px;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.15s, transform 0.1s;
            flex-shrink: 0;
        }
        .pb-btn:hover { background: rgba(255,255,255,0.2); }
        .pb-btn:active { transform: scale(0.94); }
        .pb-btn.primary { background: var(--accent); color: #04121f; }
        .pb-btn.primary:hover { background: #67d3fb; }

        #simTime {
            font-size: 13px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            min-width: 52px;
            text-align: center;
            color: var(--accent);
        }

        #timelineSlider { flex: 1; min-width: 80px; }

        input[type="range"] {
            -webkit-appearance: none;
            height: 5px;
            border-radius: 3px;
            background: rgba(255,255,255,0.15);
            outline: none;
            cursor: pointer;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px; height: 14px; border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 6px rgba(56,189,248,0.6);
            cursor: pointer;
        }
        input[type="range"]::-moz-range-thumb {
            width: 14px; height: 14px; border-radius: 50%;
            background: var(--accent); border: none; cursor: pointer;
        }

        #speedSelect, #constellationSelect {
            background: rgba(255,255,255,0.1);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 8px;
            font-size: 12px;
            cursor: pointer;
            flex-shrink: 0;
        }
        #speedSelect option, #constellationSelect option { background: #161b27; }
        #constellationSelect { max-width: 168px; }

        /* ---------- Custom constellation panel (可选星座) ---------- */
        #constellationPanel {
            left: 50%;
            transform: translateX(-50%);
            bottom: 84px;
            width: 320px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 60;
        }
        #constellationPanel .cp-title { font-size: 13px; font-weight: 600; }
        #constellationPanel .cp-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
        }
        #constellationPanel label {
            display: flex; flex-direction: column; gap: 4px;
            font-size: 11px; color: var(--text-dim);
        }
        #constellationPanel input {
            background: rgba(255,255,255,0.08);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            padding: 5px 7px;
            font-size: 12px;
            width: 100%;
            box-sizing: border-box;
        }
        #constellationPanel .cp-hint { font-size: 11px; color: var(--text-dim); }
        #constellationPanel .cp-actions {
            display: flex; gap: 8px; justify-content: flex-end;
        }

        /* ---------- File transfer panel (Milestone A, C期) ---------- */
        /* 几何约束：文件传输上边缘位于「统计」(#statsPanel) 下边缘下方 14px（--panel-gap），
           且左边缘与统计面板左边缘完全对齐（左侧边界重合）。
           此处 CSS 以统计面板 top:70px + max-height:42vh 及左列几何（--panel-side/--panel-width）
           作相对计算的回退值，实际下边缘由页尾 syncPanelGeometry 脚本按实测矩形动态维持。 */
        :root { --panel-gap: 14px; --panel-side: 14px; --panel-width: 230px; }
        #filePanel {
            left: calc(100vw - var(--panel-side) - var(--panel-width));
            right: auto;
            top: calc(70px + 42vh + var(--panel-gap));
            width: var(--panel-width); max-height: calc(58vh - 104px); display: flex; flex-direction: column;
        }
        #filePanel .panel-body { overflow-y: auto; min-height: 0; }
        #fileReopen { right: 14px; top: calc(70px + 42vh + var(--panel-gap)); }
        .file-form { display: flex; flex-direction: column; gap: 7px; padding-bottom: 10px; border-bottom: 1px solid var(--border); margin-bottom: 10px; }
        .file-form .f-row { display: flex; gap: 7px; }
        .file-form .f-field { flex: 1; display: flex; flex-direction: column; gap: 3px; }
        .file-form label { font-size: 10.5px; color: var(--text-dim); letter-spacing: 0.5px; }
        .file-form select, .file-form input[type="number"] {
            width: 100%; background: rgba(255,255,255,0.08); color: var(--text);
            border: 1px solid var(--border); border-radius: 7px; padding: 5px 7px; font-size: 12px;
        }
        .file-form select option { background: #161b27; }
        /* Milestone C: satellite locate row (number -> jump to a satellite) */
        .file-form .sat-locate { align-items: flex-end; }
        .file-form .sat-locate input[type="text"] {
            width: 100%; background: rgba(255,255,255,0.08); color: var(--text);
            border: 1px solid var(--border); border-radius: 7px; padding: 5px 7px; font-size: 12px;
        }
        .file-form .sat-locate input[type="text"].loc-ok { border-color: #4ade80; }
        .file-form .sat-locate input[type="text"].loc-bad { border-color: #f87171; }
        .file-form .locate-btn {
            background: rgba(255,255,255,0.10); color: var(--text); border: 1px solid var(--border);
            border-radius: 7px; padding: 5px 8px; font-size: 11.5px; cursor: pointer;
            white-space: nowrap; transition: background 0.15s;
        }
        .file-form .locate-btn:hover { background: rgba(255,255,255,0.22); }
        .file-pick {
            display: flex; align-items: center; gap: 8px; cursor: pointer;
            background: rgba(255,255,255,0.06); border: 1px dashed var(--border);
            border-radius: 8px; padding: 8px 10px; font-size: 12px; color: var(--text-dim);
            transition: background 0.15s;
        }
        .file-pick:hover { background: rgba(255,255,255,0.12); color: var(--text); }
        .file-pick.has-file { color: var(--text); border-style: solid; }
        .file-pick .fname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .file-pick .fsize { color: var(--text-dim); font-size: 11px; }
        .file-send-btn {
            background: var(--accent); color: #04121f; border: none; border-radius: 8px;
            padding: 8px; font-size: 12.5px; font-weight: 600; cursor: pointer; transition: background 0.15s;
        }
        .file-send-btn:hover { background: #67d3fb; }
        .file-send-btn:disabled { background: rgba(255,255,255,0.12); color: var(--text-dim); cursor: not-allowed; }
        .file-list { display: flex; flex-direction: column; gap: 8px; }
        .file-empty { font-size: 11.5px; color: var(--text-dim); text-align: center; padding: 8px 0; }
        .file-card {
            background: rgba(255,255,255,0.05); border: 1px solid var(--border);
            border-radius: 9px; padding: 9px 10px; cursor: pointer; transition: background 0.15s, border-color 0.15s;
        }
        .file-card:hover { background: rgba(255,255,255,0.09); }
        .file-card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
        .file-card .fc-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
        .file-card .fc-name { font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
        .file-card .fc-badge { font-size: 10px; padding: 2px 7px; border-radius: 999px; font-weight: 600; flex-shrink: 0; }
        .fc-badge.TRANSFERRING { background: rgba(56,189,248,0.18); color: var(--accent); }
        .fc-badge.COMPLETE { background: rgba(52,211,153,0.18); color: var(--good); }
        .fc-badge.CANCELLED { background: rgba(139,152,169,0.18); color: var(--text-dim); }
        .fc-badge.STORED { background: rgba(251,191,36,0.18); color: var(--warn); }
        .file-card .fc-bar { height: 5px; border-radius: 3px; background: rgba(255,255,255,0.1); overflow: hidden; margin-bottom: 6px; }
        .file-card .fc-bar > div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--good)); border-radius: 3px; transition: width 0.3s; }
        .file-card .fc-meta { font-size: 10.5px; color: var(--text-dim); line-height: 1.5; font-variant-numeric: tabular-nums; }
        .file-card .fc-meta b { color: var(--text); font-weight: 600; }
        .file-card .fc-path { font-size: 10px; color: var(--text-dim); margin-top: 3px; word-break: break-all; }
        .file-card .fc-actions { display: flex; gap: 6px; margin-top: 7px; }
        .file-card .fc-actions button {
            flex: 1; font-size: 11px; padding: 4px 6px; border-radius: 6px; cursor: pointer;
            border: 1px solid var(--border); background: rgba(255,255,255,0.07); color: var(--text);
        }
        .file-card .fc-actions button:hover { background: rgba(255,255,255,0.16); }
        .file-card .fc-actions button.dl { background: rgba(52,211,153,0.16); color: var(--good); border-color: rgba(52,211,153,0.4); }
        .file-card .fc-actions button.cancel { color: var(--bad); }

        /* ---------- Experiment lab entry (改进 #2，跳转 lab.html) ---------- */
        #expBtn {
            position: static; /* 覆盖 .glass 的 absolute，回归顶栏 flex 流 */
            pointer-events: auto;
            border: 1px solid rgba(56,189,248,0.55);
            background: rgba(56,189,248,0.16);
            color: var(--accent);
            font-weight: 600;
            border-radius: 999px;
            padding: 7px 14px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.15s;
        }
        #expBtn:hover { background: rgba(56,189,248,0.32); }

        /* ---------- Hint toast ---------- */
        #hintToast {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 86px;
            background: var(--bg-glass);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 7px 16px;
            font-size: 12px;
            color: var(--text-dim);
            z-index: 18;
            backdrop-filter: blur(14px);
            pointer-events: none;
            opacity: 1;
            transition: opacity 0.6s;
        }
        #hintToast.hide { opacity: 0; }

        /* ---------- 断线遮罩 (P1) ---------- */
        #connOverlay {
            position: fixed;
            inset: 0;
            background: rgba(5, 8, 16, 0.74);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            z-index: 60;
            display: none;
            align-items: center;
            justify-content: center;
        }
        #connOverlay .co-card {
            background: var(--bg-glass);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            padding: 26px 34px;
            text-align: center;
            max-width: 360px;
        }
        #connOverlay .co-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
        #connOverlay .co-msg { font-size: 12.5px; color: var(--text-dim); margin-bottom: 18px; line-height: 1.7; }
        #connOverlay .co-btn {
            background: var(--accent); color: #04121f; border: none; border-radius: 8px;
            padding: 9px 22px; font-size: 13px; font-weight: 600; cursor: pointer;
            transition: background 0.15s;
        }
        #connOverlay .co-btn:hover { background: #67d3fb; }

        /* ---------- Toast 提示 (P1，替代 alert) ---------- */
        #appToast {
            position: absolute;
            top: 64px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-glass);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 8px 18px;
            font-size: 12.5px;
            z-index: 50;
            backdrop-filter: blur(14px);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            max-width: 70vw;
        }
        #appToast.show { opacity: 1; }
        #appToast.ok { color: var(--good); }
        #appToast.bad { color: var(--bad); }

        /* ---------- 小屏响应式适配 (P1) ---------- */
        @media (max-width: 900px) {
            #brand .sub { display: none; }
            #chartPanel { display: none; }
            #chartReopen { display: none !important; }
            #filePanel { top: auto; bottom: 92px; left: auto; right: 14px; max-height: 40vh; width: 280px; }
            #fileReopen { top: auto; bottom: 92px; }
            #detailPanel { width: min(280px, calc(100vw - 28px)); }
        }
        @media (max-width: 600px) {
            #layersPanel { display: none; }
            #layersReopen { display: none !important; }
            #playbackBar { gap: 8px; padding: 8px 10px; bottom: 14px; }
            #hintToast { display: none; }
        }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>

    <!-- Top bar -->
    <div id="topBar">

    <!-- Custom constellation parameters (可选星座) -->

    <!-- 断线遮罩 (P1)：断线时全屏提示，自动重连耗尽后提供手动重连 -->

        </div>
    </div>

    <!-- Toast 提示 (P1) -->
    <div id="appToast"></div>


    <!-- 面板几何联动：维持「时序指标↔图层」「文件传输↔统计」的对齐/间距约束。
         - #chartPanel.top = #layersPanel 下边缘 + 14px，且 #chartPanel 右边缘对齐 #layersPanel 右边缘；
         - #filePanel.top  = #statsPanel 下边缘 + 14px， 且 #filePanel 左边缘对齐 #statsPanel 左边缘。
         窗口尺寸变化（resize / 内容撑高）与折叠/展开（display 切换）时均动态重算。 -->
    <script>
    (function () {
        // 垂直间距：与 CSS --panel-gap 保持一致
        var GAP = 14;
        var NARROW = '(max-width: 900px)'; // 与 CSS 小屏断点保持一致

        function apply() {
            var chart = document.getElementById('chartPanel');
            var layers = document.getElementById('layersPanel');
            var file = document.getElementById('filePanel');
            var stats = document.getElementById('statsPanel');
            if (!chart || !layers || !file || !stats) return;
            var narrow = window.matchMedia && window.matchMedia(NARROW).matches;

            // 时序指标 ← 图层：top 位于图层下边缘下方 14px，右边缘对齐；图层隐藏时回退 CSS 相对计算；
            // 自身或参照面板（图层）被用户手动拖动 → 解除联动，保持原位不动；双击头部可恢复
            if (chart.dataset.userPlaced || layers.dataset.userPlaced) {
                // 保持当前位置不变（折叠按钮等操作不应重置已冻结的面板）
            } else if (!narrow && layers.offsetParent !== null) {
                var lr = layers.getBoundingClientRect();
                chart.style.top = (lr.bottom + GAP) + 'px';
                chart.style.right = (window.innerWidth - lr.right) + 'px';
                chart.style.left = 'auto';
                chart.style.bottom = 'auto';
            } else {
                chart.style.top = '';
                chart.style.right = '';
                chart.style.left = '';
                chart.style.bottom = '';
            }

            // 文件传输 ← 统计：top 位于统计下边缘下方 14px，左边缘对齐；统计收起时回退 CSS 相对计算；
            // 自身或参照面板（统计）被用户手动拖动 → 解除联动，保持原位不动；双击头部可恢复
            if (file.dataset.userPlaced || stats.dataset.userPlaced) {
                // 保持当前位置不变（折叠按钮等操作不应重置已冻结的面板）
            } else if (!narrow && stats.offsetParent !== null) {
                var sr = stats.getBoundingClientRect();
                file.style.top = (sr.bottom + GAP) + 'px';
                file.style.left = sr.left + 'px';
                file.style.right = 'auto';
            } else {
                file.style.top = '';
                file.style.left = '';
                file.style.right = '';
            }
        }

        window.addEventListener('resize', apply);
        // 图层/统计面板折叠展开、内容高度变化时重新联动
        var mo = new MutationObserver(apply);
        ['layersPanel', 'statsPanel'].forEach(function (id) {
            var el = document.getElementById(id);
            if (el) mo.observe(el, { attributes: true, attributeFilter: ['style', 'class'] });
        });
        if (window.ResizeObserver) {
            var ro = new ResizeObserver(apply);
            ['layersPanel', 'statsPanel'].forEach(function (id) {
                var el = document.getElementById(id);
                if (el) ro.observe(el);
            });
        }
        // ---------- 拖动上边缘移动面板 + 最近使用窗口置顶 ----------
        function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

        // z-index 推叠机制：任意面板被按下/拖动/双击时提升为当前最高层级，
        // 保证最近操作的窗口始终浮于其他面板之上，避免被遮挡
        var TOP_Z = 100;
        function bringToFront(panel) { panel.style.zIndex = String(++TOP_Z); }

        // 将面板归一化为 left/top 锚定：去除 translateX 居中（如星座面板）、
        // 将 right/bottom 锚定固化为等效 left/top，避免后续拖动/缩放坐标偏移；返回归一后的矩形
        function normalizeAnchor(panel) {
            var rect = panel.getBoundingClientRect();
            if (getComputedStyle(panel).transform !== 'none') panel.style.transform = 'none';
            panel.style.left = rect.left + 'px';
            panel.style.top = rect.top + 'px';
            panel.style.right = 'auto';
            panel.style.bottom = 'auto';
            return panel.getBoundingClientRect();
        }

        function makeDraggable(panelId, handleSelector) {
            var panel = document.getElementById(panelId);
            if (!panel) return;
            var handle = panel.querySelector(handleSelector || '.panel-header');
            if (!handle) return;

            handle.addEventListener('pointerdown', function (e) {
                if (e.pointerType === 'mouse' && e.button !== 0) return;
                if (e.target.closest('button')) return; // 折叠按钮不触发拖动；click 事件不受影响
                var rect = normalizeAnchor(panel);
                var dx = e.clientX - rect.left, dy = e.clientY - rect.top;
                panel.classList.add('dragging');
                try { handle.setPointerCapture(e.pointerId); } catch (err) { /* 老浏览器降级 */ }
                e.preventDefault();

                function onMove(ev) {
                    var left = clamp(ev.clientX - dx, 0, Math.max(0, window.innerWidth - rect.width));
                    var top = clamp(ev.clientY - dy, 0, Math.max(0, window.innerHeight - rect.height));
                    panel.style.left = left + 'px';
                    panel.style.top = top + 'px';
                    panel.style.right = 'auto';
                    panel.style.bottom = 'auto';
                    panel.dataset.userPlaced = '1'; // 标记用户定位，几何联动跳过覆写（见 apply）
                    bringToFront(panel); // 拖动过程中同步提升层级（pointermove）
                }
                function onUp(ev) {
                    panel.classList.remove('dragging');
                    handle.removeEventListener('pointermove', onMove);
                    handle.removeEventListener('pointerup', onUp);
                    handle.removeEventListener('pointercancel', onUp);
                    try { handle.releasePointerCapture(ev.pointerId); } catch (err) { /* 忽略 */ }
                }
                handle.addEventListener('pointermove', onMove);
                handle.addEventListener('pointerup', onUp);
                handle.addEventListener('pointercancel', onUp);
            });

            // 面板内任意按下 / 双击 → 置顶（最近使用的窗口推叠在其他窗口之上）
            panel.addEventListener('pointerdown', function () { bringToFront(panel); });
            panel.addEventListener('dblclick', function () { bringToFront(panel); });

            // 双击头部：清除用户定位，恢复对齐/间距联动（重新执行 apply）
            handle.addEventListener('dblclick', function () {
                delete panel.dataset.userPlaced;
                panel.style.top = '';
                panel.style.left = '';
                panel.style.right = '';
                panel.style.bottom = '';
                apply();
            });
        }
        // 所有玻璃态面板均可拖动；星座面板以 .cp-title 为手柄（内含表单输入，避免整面板拦截）
        makeDraggable('layersPanel');
        makeDraggable('statsPanel');
        makeDraggable('chartPanel');
        makeDraggable('filePanel');
        makeDraggable('constellationPanel', '.cp-title');
        makeDraggable('detailPanel');

        // ---------- 边缘拖动调整窗口尺寸：左/右边缘改宽度，下边缘改高度 ----------
        var MIN_W = 180, MIN_H = 100; // 最小宽高下限，防止缩到无法操作或内容溢出
        var RESIZABLE_IDS = ['layersPanel', 'statsPanel', 'chartPanel', 'filePanel', 'constellationPanel', 'detailPanel'];

        function makeResizable(panelId) {
            var panel = document.getElementById(panelId);
            if (!panel) return;

            [{ name: 'left', cls: 'rh-left' }, { name: 'right', cls: 'rh-right' }, { name: 'bottom', cls: 'rh-bottom' }]
            .forEach(function (spec) {
                var h = document.createElement('div');
                h.className = 'resize-handle ' + spec.cls;
                h.title = '拖动调整大小';
                panel.appendChild(h);

                h.addEventListener('pointerdown', function (e) {
                    if (e.pointerType === 'mouse' && e.button !== 0) return;
                    e.preventDefault();
                    var rect = normalizeAnchor(panel);
                    panel.style.maxWidth = 'none';
                    panel.style.maxHeight = 'none'; // 解除 CSS 限高/宽，允许按需增大（视口仍作上限）
                    panel.classList.add('resizing');
                    try { h.setPointerCapture(e.pointerId); } catch (err) { /* 老浏览器降级 */ }
                    var startX = e.clientX, startY = e.clientY;
                    var w0 = rect.width, h0 = rect.height, l0 = rect.left, t0 = rect.top, r0 = rect.right;
                    var pending = null, rafId = 0;

                    function update() {
                        rafId = 0;
                        var dx = pending.clientX - startX, dy = pending.clientY - startY;
                        if (spec.name === 'right') {
                            // 视口边界保护：右边缘不超出视口右侧；最小宽度限制
                            panel.style.width = clamp(w0 + dx, MIN_W, window.innerWidth - l0) + 'px';
                        } else if (spec.name === 'left') {
                            // 左边缘不超出视口左侧（最大宽度 = 当前右边缘坐标）
                            var w = clamp(w0 - dx, MIN_W, r0);
                            panel.style.left = (r0 - w) + 'px';
                            panel.style.width = w + 'px';
                        } else {
                            // 下边缘不超出视口底部；最小高度限制
                            panel.style.height = clamp(h0 + dy, MIN_H, window.innerHeight - t0) + 'px';
                        }
                    }
                    function onMove(ev) {
                        pending = ev; // rAF 合帧：每帧最多写一次样式，实时平滑缩放且避免布局抖动
                        if (!rafId) rafId = requestAnimationFrame(update);
                    }
                    function onUp(ev) {
                        if (rafId) cancelAnimationFrame(rafId);
                        panel.classList.remove('resizing');
                        h.removeEventListener('pointermove', onMove);
                        h.removeEventListener('pointerup', onUp);
                        h.removeEventListener('pointercancel', onUp);
                        try { h.releasePointerCapture(ev.pointerId); } catch (err) { /* 忽略 */ }
                        // 联动兼容：缩放只改尺寸不破边缘约束，释放后重新应用对齐逻辑；
                        // 被 userPlaced 冻结的面板（自身或参照面板已手动拖动）仍保持原位，尺寸保留
                        apply();
                    }
                    h.addEventListener('pointermove', onMove);
                    h.addEventListener('pointerup', onUp);
                    h.addEventListener('pointercancel', onUp);
                });
            });
        }
        RESIZABLE_IDS.forEach(makeResizable);

        apply();
    })();
    </script>
